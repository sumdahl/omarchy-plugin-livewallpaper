name: validate

# Gate on main. This is the required status check behind the branch ruleset, so
# nothing reaches the branch users update from without passing it.
#
# It checks shape, not intent: a manifest the shell will accept, QML that parses,
# shell scripts that parse. It is not a malware scan and must never be described
# as one — Omarchy's own plugin validation is a manifest-schema check too.
on:
  pull_request:
  push:
    branches: [main, dev]
    # Tags too, or the version-match step below can never fire — it is guarded on
    # a tag ref, so without this it was dead code on every run.
    tags: ['v*']

# Least privilege: this job only ever reads the tree.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest is valid against the shell's schema
        run: |
          set -euo pipefail
          jq -e . manifest.json > /dev/null
          # Mirrors the checks in omarchy-plugin-validate / PluginRegistry.qml.
          jq -e '.schemaVersion == 1' manifest.json > /dev/null
          for f in id name version kinds entryPoints; do
            jq -e --arg f "$f" 'has($f)' manifest.json > /dev/null \
              || { echo "manifest missing required field '$f'"; exit 1; }
          done
          jq -e '(.kinds | type) == "array" and (.kinds | length) > 0' manifest.json > /dev/null
          jq -e '(.entryPoints | type) == "object"' manifest.json > /dev/null
          # Every entry point must be a safe relative path that actually exists —
          # the shell refuses to load a plugin whose entry points do not resolve.
          while read -r p; do
            case "$p" in
              /*|*..*) echo "unsafe entry point path: $p"; exit 1 ;;
            esac
            [[ -f $p ]] || { echo "entry point does not exist: $p"; exit 1; }
          done < <(jq -r '.entryPoints[]' manifest.json)
          echo "manifest ok: $(jq -r .id manifest.json) $(jq -r .version manifest.json)"

      - name: release version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          manifest="$(jq -r .version manifest.json)"
          [[ $tag == "$manifest" ]] || {
            echo "tag v$tag does not match manifest version $manifest"; exit 1; }

      - name: shell scripts parse
        run: |
          set -euo pipefail
          for f in bin/* install.sh; do
            [[ -f $f ]] || continue
            head -1 "$f" | grep -q '^#!.*\(ba\)\?sh' || continue
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
            echo "ok: $f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Advisory: style findings should not block a release, but real errors
          # should be visible in the log.
          shellcheck -S error bin/* install.sh || true

      - name: QML parses
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qml6-module-qtqml qt6-declarative-dev-tools || true
          if command -v qmllint6 >/dev/null; then LINT=qmllint6
          elif command -v qmllint >/dev/null; then LINT=qmllint
          else echo "no qmllint available on the runner; skipping"; exit 0
          fi
          # Omarchy's own modules (qs.Commons, Quickshell) are not installed on
          # the runner, so unresolved imports are expected and not failures. Only
          # a parse error is.
          rc=0
          for f in *.qml; do
            out=$("$LINT" "$f" 2>&1) || true
            if grep -qiE "Unexpected token|Expected token|syntax error" <<<"$out"; then
              # The typed-function syntax in IpcHandler trips older qmllint.
              grep -viE "IpcHandler|`void`" <<<"$out" | grep -qiE "Unexpected token|Expected token|syntax error" && {
                echo "parse error in $f"; echo "$out"; rc=1; }
            fi
          done
          exit $rc
